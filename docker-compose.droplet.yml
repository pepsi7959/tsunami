# Control-plane stack for a single droplet: etcd + 2 oceans + web control.
# Workers run elsewhere (anywhere) and only need the etcd endpoint (+ token).
#
#   1. edit deploy/droplet/ocean1.yaml + ocean2.yaml: set advertise.grpc to your
#      droplet's PUBLIC host and set a shared auth.token.
#   2. docker compose -f docker-compose.droplet.yml up --build -d
#   3. on each worker box: fill deploy/worker.remote.yaml and run the tsunami
#      image with it mounted at /etc/tsunami/config.yaml.
#
# SECURITY: etcd (2379) and the ocean attach ports (8050/8060) are PUBLIC here so
# remote workers can reach them. Lock them down — firewall to known workers, and
# ideally terminate TLS (see DEPLOY.md). The client API (8080/8081) and web
# control (8082) can command the whole fleet — put them behind auth / a VPN.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=tsunami
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 10

  ocean1:
    build: { context: ., target: ocean }
    volumes:
      - ./deploy/droplet/ocean1.yaml:/etc/tsunami/config.yaml:ro
    ports:
      - "8080:8080" # client API + web control target
      - "8050:8050" # worker attach (workers dial <host>:8050)
    depends_on:
      etcd: { condition: service_healthy }

  ocean2:
    build: { context: ., target: ocean }
    volumes:
      - ./deploy/droplet/ocean2.yaml:/etc/tsunami/config.yaml:ro
    ports:
      - "8081:8080"
      - "8060:8050" # workers dial <host>:8060 for ocean-2
    depends_on:
      etcd: { condition: service_healthy }

  webcontrol:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./webcontrol:/usr/share/nginx/html:ro
    depends_on:
      - ocean1
