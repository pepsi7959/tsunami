# Web control nginx: serve the static app AND reverse-proxy the ocean API under
# /api/ so the browser talks to a SINGLE origin. This makes the session cookie
# first-party (sent by every browser, incl. Safari) — no cross-origin/SameSite
# problems — and removes the need for CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ocean HTTP API (same-origin from the browser's point of view)
  location /api/ {
    proxy_pass http://ocean:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
