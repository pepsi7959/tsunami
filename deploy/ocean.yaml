name: ocean-1
id: ocean-1
endpoints:
  http: 0.0.0.0:8080 # client API + web control
  grpc: 0.0.0.0:8050 # worker attach stream
advertise:
  grpc: ocean:8050 # compose service name (reachable by workers on the network)
max_connections: 100
registry:
  endpoints:
    - etcd:2379
lease:
  ttl: 10
auth:
  db_path: /var/lib/tsunami/auth.db # SQLite users + sessions (mount a volume here)
  session_ttl: 3600                  # session lifetime, seconds (1 hour)
  cookie_secure: false               # set true behind HTTPS
  bootstrap_admin:
    username: admin                  # password via ADMIN_PASS env (see docker-compose)
