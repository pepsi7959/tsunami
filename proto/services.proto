syntax = "proto3";

package tsgrpc;

option go_package = "github.com/tsunami/proto;tsgrpc";

// TSAttach is the worker->ocean control plane. A worker dials an ocean and
// keeps a single bidirectional stream open for its lifetime: it sends Register
// (once), then Reports/Heartbeats; the ocean sends Commands (start/stop).
service TSAttach {
  rpc Attach(stream WorkerMessage) returns (stream OceanMessage) {}
}

enum HTTPMethod {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
  UPDATE = 4;
}

message HTTPHeader {
  string key = 1;
  string value = 2;
}

// Params describes a load test (carried by a START command).
message Params {
  string name = 1;
  string url = 2;
  HTTPMethod method = 3;
  string protocol = 4;
  string host = 5;
  string port = 6;
  string path = 7;
  int32 concurrency = 8;
  repeated HTTPHeader header = 9;
  string body = 10;
  bool verbose = 11; // when true the worker records the last request/response
}

// ---------- worker -> ocean ----------
message Register {
  string worker_id = 1;
  string name = 2;
  int32 max_concurrency = 3;
}

message Metric {
  string job = 1;
  int32 worker_count = 2;
  int64 request_count = 3;
  int64 error_count = 4;
  double avg = 5;
  double min = 6;
  double max = 7;
  double rps = 8;
  double elapsed_time = 9;
  // cumulative success-latency histogram; bucket[i] = count with latency <=
  // latencyBucketBoundsMs[i] (last bucket is the +Inf overflow). Consumers diff
  // successive reports for per-interval percentiles + a latency heatmap.
  repeated int64 bucket = 10;
}

// Sample is the last request/response a worker captured for a verbose job.
message Sample {
  string method = 1;
  string url = 2;
  repeated HTTPHeader request_header = 3;
  string request_body = 4;
  int32 status_code = 5;
  repeated HTTPHeader response_header = 6;
  string response_body = 7;
  double latency_ms = 8;
  string error = 9; // set instead of a response when the request itself failed
  int64 ts = 10;    // capture time, unix milliseconds
}

message Report {
  Metric metric = 1;
  Sample sample = 2; // set only for verbose jobs
}

message Heartbeat {
  int64 ts = 1;
}

message WorkerMessage {
  oneof msg {
    Register register = 1;
    Report report = 2;
    Heartbeat heartbeat = 3;
  }
}

// ---------- ocean -> worker ----------
enum Action {
  START = 0;
  STOP = 1;
}

message Command {
  Action action = 1;
  string job = 2;
  Params params = 3; // set for START
}

message OceanMessage {
  oneof msg {
    Command command = 1;
  }
}
