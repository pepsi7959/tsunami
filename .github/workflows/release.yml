name: release

# Cuts a GitHub Release with static linux binaries when a v* tag is pushed.
# The one-command installer (install.sh) downloads these assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Used for manual dry runs."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/tsunami ./worker
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/ocean ./master

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          archive="tsunami_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          tar -C dist -czf "$archive" tsunami ocean
          sha256sum "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tsunami_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            tsunami_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            tsunami_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release on a real tag push, not on manual dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          cat *.tar.gz.sha256 > SHA256SUMS
          rm -f *.tar.gz.sha256
          echo "--- release assets ---"; ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/tsunami_*.tar.gz
            artifacts/SHA256SUMS
