# Local dev stack (streaming model): etcd + ocean + one worker + web control.
#   docker compose up --build -d
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=tsunami-etcd
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 10

  ocean:
    build:
      context: .
      target: ocean
    ports:
      - "8080:8080" # client API + web control target
      - "8050:8050" # worker attach stream
    depends_on:
      etcd:
        condition: service_healthy

  # outbound-only workers: each discovers the ocean via etcd and attaches. No
  # inbound ports and no healthcheck (they run no server). Each mounts its own
  # config so it registers with a distinct id.
  tsunami:
    build:
      context: .
      target: tsunami
    volumes:
      - ./deploy/tsunami.yaml:/etc/tsunami/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      ocean:
        condition: service_started

  tsunami2:
    build:
      context: .
      target: tsunami
    volumes:
      - ./deploy/tsunami2.yaml:/etc/tsunami/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      ocean:
        condition: service_started

  webcontrol:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./webcontrol:/usr/share/nginx/html:ro
    depends_on:
      - ocean
